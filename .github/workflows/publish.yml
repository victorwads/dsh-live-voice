name: Publish to npm
on:
  workflow_dispatch:
    inputs:
      target:
        description: Packages to publish
        type: choice
        default: both
        options: [both, live-voice, live-voice-debugger]
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.10.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package versions
        run: pnpm check:versions
      - name: Run automated tests
        run: pnpm test
      - name: Verify committed release runtime bundles
        run: npm run check:dist
      - name: Validate release metadata
        id: release
        env:
          TARGET: ${{ inputs.target }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const main = JSON.parse(fs.readFileSync('packages/live-voice/package.json', 'utf8'));
          const debuggerPackage = JSON.parse(fs.readFileSync('packages/live-voice-debugger/package.json', 'utf8'));
          const repository = 'git+https://github.com/' + process.env.GITHUB_REPOSITORY + '.git';
          if (main.name !== 'dsh-live-voice' || debuggerPackage.name !== 'dsh-live-voice-debugger') throw new Error('Unexpected package names');
          if (main.version !== debuggerPackage.version || !/^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(main.version)) throw new Error('Invalid or mismatched versions');
          const tag = main.version.includes('-') ? main.version.split('-')[1].split('.')[0] : 'latest';
          if (!/^[a-z][a-z0-9._-]*$/.test(tag)) throw new Error('Invalid npm dist-tag');
          for (const pkg of [main, debuggerPackage]) {
            if (pkg.private || pkg.repository?.url !== repository) throw new Error('Invalid publication metadata for ' + pkg.name);
            if (pkg.publishConfig?.tag && pkg.publishConfig.tag !== tag) throw new Error('Dist-tag mismatch for ' + pkg.name);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\nversion=' + main.version + '\ngit_tag=v' + main.version + '\n');
          NODE
      - name: Reject published selected versions
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_TAG: ${{ steps.release.outputs.git_tag }}
        run: |
          if [[ "$TARGET" != "live-voice-debugger" ]]; then
            refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$VERSION")
            if [[ -n "$refs" ]]; then echo "Version tag already exists; bump both package versions."; exit 1; fi
          fi
          node <<'NODE'
          (async () => {
            const names = process.env.TARGET === 'both' ? ['dsh-live-voice', 'dsh-live-voice-debugger'] : ['dsh-' + process.env.TARGET];
            for (const name of names) {
              const response = await fetch('https://registry.npmjs.org/' + name + '/' + encodeURIComponent(process.env.VERSION), {signal: AbortSignal.timeout(30000)});
              if (response.ok) throw new Error(name + ' version already published; select the unpublished package or bump both versions');
              if (response.status !== 404) throw new Error('Registry check failed for ' + name + ': ' + response.status);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Validate main package contents
        if: inputs.target != 'live-voice-debugger'
        working-directory: packages/live-voice
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --dry-run --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/
      - name: Validate debugger package contents
        if: inputs.target != 'live-voice'
        working-directory: packages/live-voice-debugger
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --dry-run --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/
      - name: Create version tag
        if: inputs.target != 'live-voice-debugger'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.git_tag }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
      - name: Publish main package using OIDC
        if: inputs.target != 'live-voice-debugger'
        working-directory: packages/live-voice
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/
      - name: Publish debugger package using OIDC
        if: inputs.target != 'live-voice'
        working-directory: packages/live-voice-debugger
        env:
          DIST_TAG: ${{ steps.release.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org/
      - name: Create GitHub Release
        if: inputs.target != 'live-voice-debugger'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.git_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes "${flags[@]}"
