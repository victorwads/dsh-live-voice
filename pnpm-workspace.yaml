packages:
  - 'packages/*'

# Approve only the esbuild versions reviewed in the frozen lockfile.
# Unlisted dependency install scripts remain blocked by pnpm.
allowBuilds:
  esbuild@0.25.12: true
  esbuild@0.28.2: true
  # Browser ASR bundles onnxruntime-web; do not run native Node binary installation.
  onnxruntime-node: false
  protobufjs: false
